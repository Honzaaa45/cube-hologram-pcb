<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="CUBE — afficheur holographique Pepper's Ghost">
  <defs>
    <linearGradient id="dTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="dScreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dGlow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="dSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="14" fill="#0b1020"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#1e293b"/>

  <!-- ================= texte ================= -->
  <g font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
    <text x="72" y="118" font-size="66" font-weight="700" fill="url(#dTitle)"
          letter-spacing="10">CUBE</text>
    <text x="76" y="160" font-size="21" fill="#cbd5e1">
      Afficheur holographique Pepper&#39;s Ghost
    </text>
    <text x="76" y="196" font-size="15" fill="#64748b">
      ESP32-S3 · AMOLED QSPI · PCB 4 couches entièrement généré par code
    </text>
    <g font-size="12.5" fill="#94a3b8">
      <rect x="76" y="216" width="118" height="26" rx="13" fill="#111c33" stroke="#233657"/>
      <text x="135" y="233" text-anchor="middle">63 composants</text>
      <rect x="204" y="216" width="104" height="26" rx="13" fill="#111c33" stroke="#233657"/>
      <text x="256" y="233" text-anchor="middle">48 × 52 mm</text>
      <rect x="318" y="216" width="150" height="26" rx="13" fill="#111c33" stroke="#233657"/>
      <text x="393" y="233" text-anchor="middle">0 violation DRC</text>
    </g>
  </g>

  <!-- ================= optique ================= -->
  <g transform="translate(700,0)">
    <!-- halo de l'image flottante -->
    <ellipse cx="220" cy="155" rx="96" ry="80" fill="url(#dGlow)"/>

    <!-- cube separateur -->
    <rect x="160" y="95" width="120" height="120" rx="3"
          fill="#111c33" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.65"/>
    <!-- lame separatrice a 45 degres -->
    <line x1="160" y1="215" x2="280" y2="95" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2"/>

    <!-- dalle AMOLED -->
    <rect x="150" y="219" width="140" height="9" rx="3" fill="#1e293b" stroke="#334155"/>
    <rect x="152" y="217" width="136" height="4" rx="2" fill="url(#dScreen)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="220" y="252" font-size="12" text-anchor="middle" fill="#475569"
          font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">dalle AMOLED</text>

    <!-- rayons : montent de la dalle, se reflechissent a 45 deg vers l'oeil -->
    <g stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M190 217 L190 185 L330 185" stroke-opacity="0.9">
        <animate attributeName="stroke-dasharray" values="0 300;170 300" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.95;0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M220 217 L220 155 L330 155" stroke-opacity="0.9">
        <animate attributeName="stroke-dasharray" values="0 300;170 300" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.95;0" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M250 217 L250 125 L330 125" stroke-opacity="0.9">
        <animate attributeName="stroke-dasharray" values="0 300;170 300" dur="2.4s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.95;0" dur="2.4s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- image virtuelle : elle flotte au centre du cube -->
    <g filter="url(#dSoft)" opacity="0.9">
      <g transform="translate(220,155)">
        <g stroke="#c4b5fd" stroke-width="1.8" fill="none">
          <path d="M-22 -22 L22 -22 L22 22 L-22 22 Z"/>
          <path d="M-11 -33 L33 -33 L33 11 L-11 11 Z"/>
          <path d="M-22 -22 L-11 -33 M22 -22 L33 -33 M22 22 L33 11 M-22 22 L-11 11"/>
        </g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0;360" dur="14s" repeatCount="indefinite" additive="sum"/>
      </g>
    </g>

    <!-- oeil de l'observateur -->
    <g transform="translate(352,155)">
      <path d="M-16 0 Q0 -13 16 0 Q0 13 -16 0 Z" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="4.5" fill="#7dd3fc">
        <animate attributeName="r" values="4.5;3.2;4.5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
